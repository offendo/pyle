name: Source installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Build wheel from source distribution
        run: uv build --out-dir dist
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          uv venv /tmp/pyle-install --python "${{ matrix.python }}"
          uv pip install --python /tmp/pyle-install/bin/python dist/*.whl
          cp scripts/smoke_install.py /tmp/pyle-smoke.py
          cd /tmp
          env -u LEAN_PATH -u LEAN_SYSROOT -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/pyle-install/bin/python /tmp/pyle-smoke.py
